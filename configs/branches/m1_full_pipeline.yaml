branch:
  owner: M1
  name: battle/m1-full-pipeline
  strategy: text-first
  status: showdown_ready

shared_rules:
  metric: macro_f1
  cv:
    n_splits: 5
    shuffle: true
    random_state: 42

phase_1:
  objective:
    - lock branch-specific plan
    - reserve run ids and submission ids
    - define output files for baseline phase
  checklist:
    - branch created from main
    - shared rules reviewed
    - output locations reserved
    - candidate baseline chosen

phase_2_plan:
  run_id: exp_m1_001
  submission_id: sub_m1_001
  model_family: text_baseline
  baseline_name: tfidf_word_1_2_ovr_logreg
  vectorizer:
    analyzer: word
    ngram_range: [1, 2]
    min_df: 1
    max_df: 1.0
    sublinear_tf: true
  model:
    type: ovr_logistic_regression
    C: 4.0
    max_iter: 5000
    solver: liblinear
    class_weight: balanced
    random_state: 42

phase_2_result:
  cv_macro_f1: 0.327027
  cv_std: 0.032543
  submission_file: data/submissions/sub_m1_v1_text_word12_ovr_lr.csv
  report_files:
    - reports/battle_m1/quick_eda.md
    - reports/battle_m1/phase2_baseline_summary.md

phase_3_result:
  best_run_id: exp_m1_002
  best_submission_id: sub_m1_002
  best_candidate: word12_binary_c6
  best_direction: text_tuned_binary
  best_feature_set: title_clean_word12_binary
  best_model: ovr_logistic_regression
  cv_macro_f1: 0.334261
  cv_std: 0.041403
  improvement_vs_phase_2: 0.007234
  backup_run_id: exp_m1_011
  backup_candidate: word12_tfidf_c2_min2
  backup_cv_macro_f1: 0.330420
  backup_cv_std: 0.023573
  submission_file: data/submissions/sub_m1_v2_phase3_best.csv
  report_files:
    - reports/battle_m1/phase3_results.csv
    - reports/battle_m1/phase3_experiment_summary.md

phase_4_result:
  best_run_id: exp_m1_014
  best_submission_id: sub_m1_003
  best_candidate: ens_best_backup_50_50
  best_direction: text_only_ensemble
  best_feature_set: blend_binary_tfidf_c6__tfidf_min2_c2
  best_model: probability_blend
  cv_macro_f1: 0.337629
  cv_std: 0.024355
  improvement_vs_phase_3: 0.003368
  ensemble_members:
    - model: phase3_best_binary_tfidf_c6
      weight: 0.5
    - model: phase3_backup_tfidf_min2_c2
      weight: 0.5
  single_model_reference_run_id: exp_m1_002
  single_model_reference_cv_macro_f1: 0.334261
  submission_file: data/submissions/sub_m1_v3_phase4_text_ensemble.csv
  report_files:
    - reports/battle_m1/phase4_results.csv
    - reports/battle_m1/phase4_experiment_summary.md

phase_5_result:
  reference_single_run_id: exp_m1_002
  reference_ensemble_run_id: exp_m1_014
  single_oof_macro_f1: 0.337404
  ensemble_oof_macro_f1: 0.340033
  fixed_by_ensemble: 17
  hurt_by_ensemble: 16
  hardest_labels:
    - 3
    - 4
  key_improvements:
    label_1_f1_delta: 0.024415
    label_4_f1_delta: 0.009610
  main_tradeoff:
    label_5_f1_delta: -0.014260
  report_files:
    - reports/battle_m1/phase5_error_analysis.md
    - reports/battle_m1/phase5_cv_predictions.csv
    - reports/battle_m1/phase5_confusion_single.csv
    - reports/battle_m1/phase5_confusion_ensemble.csv
    - reports/battle_m1/phase5_per_class_metrics.csv

showdown_ready:
  main_run_id: exp_m1_014
  main_submission_id: sub_m1_003
  single_backup_run_id: exp_m1_002
  single_backup_submission_id: sub_m1_002
  stability_backup_run_id: exp_m1_011
  baseline_reference_run_id: exp_m1_001
  branch_strength: text_only_ensemble
  branch_risk: label_5_tradeoff
  comparison_status: ready_for_branch_showdown

outputs:
  branch_notes: docs/branches/m1_full_pipeline.md
  audit_log: reports/battle_m1/audit_log.md
  quick_eda_report: reports/battle_m1/quick_eda.md
  baseline_summary: reports/battle_m1/phase2_baseline_summary.md
  submission_file: data/submissions/sub_m1_v1_text_word12_ovr_lr.csv
  phase3_results_csv: reports/battle_m1/phase3_results.csv
  phase3_summary: reports/battle_m1/phase3_experiment_summary.md
  phase3_submission_file: data/submissions/sub_m1_v2_phase3_best.csv
  phase4_results_csv: reports/battle_m1/phase4_results.csv
  phase4_summary: reports/battle_m1/phase4_experiment_summary.md
  phase4_submission_file: data/submissions/sub_m1_v3_phase4_text_ensemble.csv
  phase5_report: reports/battle_m1/phase5_error_analysis.md
  phase5_predictions_csv: reports/battle_m1/phase5_cv_predictions.csv
  phase5_single_confusion_csv: reports/battle_m1/phase5_confusion_single.csv
  phase5_ensemble_confusion_csv: reports/battle_m1/phase5_confusion_ensemble.csv
  phase5_per_class_metrics_csv: reports/battle_m1/phase5_per_class_metrics.csv
  final_comparison_sheet: reports/battle_m1/final_comparison_sheet.md
  final_comparison_candidates_csv: reports/battle_m1/final_comparison_candidates.csv
